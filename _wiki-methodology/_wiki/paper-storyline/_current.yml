    evidence: "§4.1;Fig. 2b–c;两个对照定位病因在优化器"
  - id: C4
    text: "真挣到钱:全物理验证 +361.3 M$,每次实验只花 2.7 次真模拟"
    evidence: "§4.2–4.3;Fig. 3–4"

case_study: "Norne 油田注水调度。台架,不是交付对象。"
target_journal: "Petroleum Science (KeAi/Elsevier, IF 6.4)"

authority_principle: >
  权限按**实测能力**分配,不按看起来多强:
  代理有速度无赋值权(优化区 ρ=−0.21);语言智能体有推理无否决权(可行性由算术闸门判);
  全物理模拟器有赋值权,是全文所有经济数字的唯一来源。

forbidden_drift:
  - "不写 monotonic(逐轮非降非全部;只能写 consistent end-to-end improvement)"
  - "不写 causal / transferable(tilt 只有 ρ=0.714,无干预识别)"
  - "不写 expert-level(无人类专家基线)"
  - "不写优于传统优化方法(未 benchmark 任何传统优化器)"
  - "不写 equivalence"
  - "不写 robustness 提升"
  - "不说「假模拟器」,说「代理模型」"
  - "不声称知识层在决策回路内运行 —— 它是离线执行一次,产出被各次实验原样消费"

