one_sentence: >
  我们提出 Gaia 智能体团队 —— 一个面向油藏决策的分层多智能体框架,
  让智能体覆盖从原始数据、结构化知识、领域推理、快速评估到物理裁定的
  完整决策链,并在真实油田上证明它能挣到经过全物理验证的钱。
  注水调度是验证它的案例,不是它的目的。

contributions:
  - id: C1
    text: "Gaia 分层智能体架构:14 个 Agent / 5 层,智能体覆盖全决策链而非只占推理一步"
    evidence: "§3;gaia_sdk 可运行实现 + 15 项忠实性测试"
  - id: C2
    text: "代理模型:场级误差 0.369%,R²=0.9959,18.1 µs/方案(约 3.3e6 倍加速)"
