  - id: fc_rank_fidelity
    path: _code/fc_rank_fidelity.py
    type: experiment
    status: active
    owner: col2
    run: "python _code/fc_rank_fidelity.py --gpu 0 --n-cand 10 --jobs 4 --threads 12 --water-tol 5e-4"
    outputs: _pipelines/fc_rank_fidelity/rank.json
    description: >-
      🔴 **方法学核心证据**:把 fc_ms 里"代理排名与真实排名完全不一致"那**一个例子**量化成统计量。
      long/short 各取 40 个随机起点、按 θ 的 L2 距离贪心去重出 **10 个彼此可区分**的高分候选
      (两两 L2 ≥0.70/1.05),全部做**实测**注水量校正到 **±0.05%**,再 **OPM Flow 逐个真跑**
      (144 次评估;裁判永远是模拟器)。
      结果:**long ρ=-0.212(置换 p=0.557,95%CI[-0.83,+0.65])—— 排名信息量与随机无异**,
      代理第 1 名真跑排第 10/10,top-1 regret **1.387% / 46.0 M$@8%**,只吃到可得增益的 28.6%;
      **short ρ=+0.976(p=1e-4),top-1 regret 0**。
      统一解释变量是 **SNR = 真值跨度 / 代理在这些点上的误差**:
      long 0.98 → ρ≈0;short 6.52 → ρ=0.98;随机 θ 确认集 132 → ρ=0.998。SNR<1 时排名必然退化成掷骰子。
      代理在优化区域的点误差 **1.43%/1.72%**,是随机 θ 上 **0.369%** 的 3.9~4.7 倍;
      增益过原点斜率 0.394(long)→ 高估 **2.54×**。
      副产物:实测注水量对标量缩放 s 是**阶梯函数**(Δs=4e-7 处 dev 跳 0.45pp),
      两个 short 候选的 ±0.05% 在台阶之间、**根本无解**;已给不可达证据 + 弹性上界 + 严格 n=8 子集,
      结论不变。代理权重存 _pipelines/fc_rank_fidelity/surrogate.pt,算例按 θ 内容寻址复用。
