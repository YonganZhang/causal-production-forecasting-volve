# _meta/_registry.yml — code-domain / entrypoint registry
project: 自己-产能预测
schema_version: code-domain-v1
last_synced: 2026-08-09

code_domains:
  - id: main
    path: _code
    type: local_code
    status: active
    owner: project
    codemap: _codemap.md
    description: "Volve 产能实验台:数据加工、窗口构造、切分、基线、Chronos-2 封装、评估、实验入口、文献检索。"

entrypoints:
  # ---- 数据加工 ----
  - id: build_causal_dataset
    path: _code/build_causal_dataset.py
    type: script
    status: active
    owner: col5
    run: "python3 _code/build_causal_dataset.py"
    outputs: _data/volve_causal_v0.2/
    description: "Volve 官方生产 xlsx → analysis-ready CSV + 井元数据。v0.2 修正 role 判定为按首次产油/首次注水的时间先后定方向(v0.1 把 F-5 标反)。"

  # ---- 实验台核心 ----
  - id: volve_data
    path: _code/volve_data.py
    type: module
    status: active
    owner: main
    run: "python3 _code/volve_data.py"
    description: "日度 CSV 装载 + 逐井日历化(缺日 NaN / 关井真 0,两者不许混) + 注水干预源构造(F-5 转产后置 0)。"

  - id: windows
    path: _code/windows.py
    type: module
    status: active
    owner: main
    run: "python3 _code/windows.py"
    description: "30+30 滑窗(默认参数=军伟 T3 契约 30/30/7/21) + 干预分层标签。支持 volume/rate 双目标。"

  - id: splits
    path: _code/splits.py
    type: module
    status: active
    owner: main
    run: "python3 _code/splits.py"
    description: "rolling-origin 时间序 CV(主口径,60 天 embargo + 日历重叠断言) + 留一井 CV(第二口径)。"

  - id: baselines
    path: _code/baselines.py
    type: module
    status: active
    owner: main
    critical: |
      identity_rate_x_hours 是强制对照, 不许从 REGISTRY 摘掉。
      产油体积 ≈ 速率 × 开井小时(开井=0 时产油=0 占 99.87%),任何用了未来开井小时数
      的模型必须先打过这条三行公式。2026-08-06 在此栽过一次并撤稿。
      _tests/test_harness.py 有回归测试守着(gate:harness)。
    description: "平凡基线阶梯 + 恒等式及格线 + LightGBM(锚定增量,避免树模型无法外推)。"

  - id: models_chronos2
    path: _code/models_chronos2.py
    type: module
    status: active
    owner: main
    weights: "amazon/chronos-2 @ 29ec3766d36d6f73f0696f85560a422f50e8498c (本机 HF cache, 不自动下载)"
    description: "Chronos-2 封装:零样本 / past covariates / future covariates 干预条件化。"

  - id: evaluate
    path: _code/evaluate.py
    type: module
    status: active
    owner: main
    description: "MAE/RMSE/MASE/CRPS/覆盖率 + 分层聚合 + 配对 bootstrap(同窗误差相关,独立 bootstrap 会高估不确定度)。"

  # ---- 实验入口 ----
  - id: e0_replicate
    path: _code/e0_replicate.py
    type: pipeline
    status: active
    owner: main
    run: "CUDA_VISIBLE_DEVICES=5 python3 _code/e0_replicate.py"
    outputs: _pipelines/e0_replicate/results.json
    gate: e0-replication
    description: "信任锚点:复现军伟 T3 baseline(历史均值 184.6686 / Chronos-2 172.3162),门 ±1%,实测偏差 0.000%。"

  - id: run_experiment
    path: _code/run_experiment.py
    type: pipeline
    status: active
    owner: main
    run: |
      CUDA_VISIBLE_DEVICES=5 python3 _code/run_experiment.py --step 1 --target volume
      CUDA_VISIBLE_DEVICES=5 python3 _code/run_experiment.py --step 1 --target rate
    outputs: "_pipelines/e1_e3_{volume,rate}_{rolling,well}/results.json"
    description: |
      E1/E2/E3 主入口:baseline 阶梯 + 干预条件化 + 消融 + 干预分层 + 恒等式及格线判定。
      --target volume 含排产记账项(及格线在此生效);--target rate 是除掉记账项的油藏物理量。
      因果主张必须在 rate 口径上成立才算数。

  # ---- 文献 ----
  - id: lit_fetch
    path: _code/lit_fetch.py
    type: script
    status: active
    owner: col1
    run: "python3 _code/lit_fetch.py search --query '<Scopus query>' --count 25"
    gate: lit-fetch-smoke
    description: |
      Elsevier Scopus 检索 + ScienceDirect 全文下载。凭证由脚本内部经 get-credential.sh 取得,
      绝不出现在命令行/prompt/日志。子智能体只调本脚本,不接触密钥。

  - id: dml_choke
    path: _code/dml_choke.py
    type: pipeline
    status: prototype
    owner: main
    run: "python3 _code/dml_choke.py"
    description: |
      P1 原型:油嘴开度对产液/产油速率的因果剂量-响应(DML + 时间块交叉拟合 + embargo)。
      主会话对 Workflow 提案自报数字的**独立复核实现**,不是照抄其原型。
      口径纪律:目标是速率不是体积(结构上免疫记账恒等式);关井日不进估计样本但保留为
      滞后状态;X 全是滞后量。同时输出「块折 vs 随机折」对照以量化序列泄漏。

  - id: patch_eclipse_deck
    path: _code/patch_eclipse_deck.py
    type: script
    status: active
    owner: main
    run: "python3 _code/patch_eclipse_deck.py _sandbox/opm_run [--check]"
    description: |
      把官方 Volve Eclipse deck 修成 OPM Flow 能解析的形式。只改语法不改物理数值,
      每处改动写成 deck 注释可追溯。幂等, 自动备份 *.orig。
      🔴 运行时需 --parsing-strictness=low, 会忽略 ADDZCORN(断层几何)等未实现关键字,
      保真度声明见 _findings/2026-08-07-OPM-Flow-可行性验证.md。

  - id: perturb_and_run
    path: _code/perturb_and_run.py
    type: pipeline
    status: active
    owner: main
    run: "python3 _code/perturb_and_run.py --mult 1.0 0.5 2.0 --tag permx --threads 12"
    outputs: _pipelines/g0_g2_gates/g2_sensitivity_*.json
    description: |
      G2 可辨识性诊断:扰动全场渗透率, 量化每个井级观测量的响应强度。
      判据:只有对参数有响应的观测量才携带信息;无响应的拟合它等于拟合噪声。
      单次模拟约 25-35 分钟。

  # ---- 计划与测试 ----
  - id: project_plan
    path: _wiki-methodology/_top/_task_plan.md
    type: plan
    status: active
    owner: col2
    description: "当前目标、数据事实、方法路线、已完成、下一步。"

  - id: test_harness
    path: _tests/test_harness.py
    type: test
    status: active
    owner: col3
    run: "python3 _tests/test_harness.py"
    gate: harness
    description: "13 项正确性测试:窗口无泄漏、缺日不填零、分层标签手工核对、指标实现、F-5 角色修正、恒等式基线回归。"

  - id: norne_bulk
    path: _code/norne_bulk.py
    type: generator
    status: active
    owner: col3
    run: "python _code/norne_bulk.py --n 10000 --jobs 32 --threads 4"
    schema: 2
    output: /mnt/data/yongan-admin-2/datasets/petro/_bulk/norne_v2
    description: >-
      NORNE-CF 干预臂:θ 独立随机 → 因果效应有真值。边跑边抽、抽完删原始输出。
      schema v2 的 θ 是 17 维(13 个「井×相态」注入控制 + 4 个渗透率分区),
      与 v1 的 13 维(9 个未分相态的井)**语义不同, 不可混用**, 故输出目录分开。

  - id: norne_obs_arm
    path: _code/norne_obs_arm.py
    type: generator
    status: active
    owner: col3
    run: "python _code/norne_obs_arm.py run --n 2000 --jobs 32"
    output: /mnt/data/yongan-admin-2/datasets/petro/_bulk/norne_obs_v2
    description: >-
      NORNE-CF 观测臂:θ = π(油藏状态), 混杂由真实偏微分方程产生而非手写 propensity。
      与干预臂共用 norne_bulk 的 deck 构造与 CONTROLS, 保证两臂口径一致。

  - id: causal_bench
    path: _code/causal_bench.py
    type: analysis
    status: active
    owner: col3
    run: "python _code/causal_bench.py field --inj C-3H_WATER"
    description: >-
      三个子命令:truth(干预臂→真值连通矩阵)、bias(观测臂朴素回归 vs DML vs 真值)、
      field(逐单元多元 OLS + HC1 稳健标准误 → 三维效应场)。
      field 同时落 _se.npy / _t.npy / _meta.json, 估计量口径写在 meta 里。

  - id: plot_reservoir_3d
    path: _code/plot_reservoir_3d.py
    type: figure
    status: active
    owner: col3
    run: "xvfb-run -a python _code/plot_reservoir_3d.py --inj C-3H"
    description: >-
      按 ResInsight 对照的呈现设定渲染三维效应场(cutaway / layer / section 三视图)。
      默认把 |t|<2 的单元画成中性灰; 色标标题写真实估计量(每 +1 SD 的 log10 乘子)。
      文件头记录了角点绕序、垂向拉伸、坐标框三个已修的坑及其实测依据。

  - id: crm_bridge
    path: _code/crm_bridge.py
    type: analysis
    status: active
    owner: col3
    run: "python _code/crm_bridge.py --max-shards 2000"
    outputs: _pipelines/crm_bridge/f1_bridge.json
    gate: f1-bridge
    description: >-
      F1 地基实验:三维因果响应场能否重构井对 gain(CRM 口径)。
      检验 A 物理自洽(多注的水:地下储存 vs 被采出);检验 B 井口归因消融阶梯。
      结论 R² 0.019→0.403, 线性球形聚合的 0.403 是神经网络必须打败的基线。
      详见 _findings/2026-08-09-F1-三维场能否解释井对gain.md。

  - id: paths
    path: _code/paths.py
    type: module
    status: active
    owner: main
    description: >-
      统一路径解析(环境变量 → 发布包内相对路径 → 本机默认)。
      原来 9 个脚本散着 17 处硬编码绝对路径, 发布包到别人机器上 import 即崩。
      deck 缺失时从 _meta/norne_controls.json 回退, 不在 import 期崩。

  - id: make_release
    path: _code/make_release.py
    type: script
    status: active
    owner: col3
    run: "python _code/make_release.py --tier sample --n-samples 500"
    outputs: _outputs/norne-cf-{tier}-{date}.tar.gz
    description: >-
      发布打包(code / sample / full 三档)。带凭证正则扫描, 命中即中止。
      许可证边界:代码 MIT, 数据 ODbL 1.0(与上游 OPM/opm-data 一致, 带 share-alike);
      Elsevier 订阅全文任何档位都不打包。分片清单冻结并写 SHA256。

  - id: test_causal_arms
    path: _tests/test_causal_arms.py
    type: test
    status: active
    owner: col3
    run: "pytest _tests/test_causal_arms.py"
    gate: causal_arms
    description: >-
      锁死 2026-08-09 审计(Codex 跨模型复核 + 13 agent Workflow)查出的 bug:
      注入相态未分离、观测臂 except:pass 静默取消混杂、分段日期指针按均值推进、
      v1/v2 schema 混用、HC1 捷径公式、掩码后 argmax 被 NaN 劫持。

  - id: forecast_gen
    path: _code/forecast_gen.py
    type: data_generation
    status: active
    owner: col5
    run: "python _code/forecast_gen.py --n 2000 --jobs 12"
    description: >-
      预测段样本生成:历史段(1997-11→2006-12)只跑一次,N 条注水策略从 T0=3312 天
      经 RESTART+SKIPREST 分支到 2020-01-01。θ 形状 (6 段, 4 口注水井) 的 log10 乘子。
      已修 6 个 bug:SOLUTION 启发式过滤把 EQUIL 行读成 THPRES、RESTART 步号 241 vs 64、
      预测段 INCLUDE 必须插进历史 SCH **自己的 END** 之前、缺 WCONPROD、
      THP 限制需 VFP 表、harvest 依赖 RESTART 从不写的 UNRST。
  - id: fc_decision
    path: _code/fc_decision.py
    type: model
    status: active
    owner: col5
    run: "python _code/fc_decision.py"
    description: >-
      预测段决策网络。输入 24 维(6 决策阶段 × 4 注水井),输出 22 井 × 2 相 × 40 格点。
      提供 load() 作为所有下游模型的统一数据入口。
  - id: fc_benchmark
    path: _code/fc_benchmark.py
    type: experiment
    status: active
    owner: col5
    run: "python _code/fc_benchmark.py --gpu 6"
    description: >-
      六模型代理模型对拍(随机森林/SVR/GBDT/Transformer/Autoformer/Chronos-2)。
      公平性纪律:同一切分、同一指标、强制平凡基线、计时、PCA 下界(0.040%)入档。
  - id: fc_improve
    path: _code/fc_improve.py
    type: experiment
    status: superseded
    superseded_by: fc_improve2
    owner: col5
    description: >-
      🔴 方法学有误,结论不可引用。两处:(1) 物理特征矩阵秩亏(31 列秩 20,
      融合后条件数 1.29e14),导致"特征融合变差"的结论建在共线性上而非信息量上;
      (2) 每配置只跑单种子,从未做显著性检验。保留仅供追溯。
  - id: fc_improve2
    path: _code/fc_improve2.py
    type: experiment
    status: active
    owner: col5
    run: "python _code/fc_improve2.py --gpu 6 --seeds 8 [--drop-dead]"
    description: >-
      代理模型改进 v2。修正 v1 的三个问题:去共线物理特征(条件数 1.29e14 → 24.5)、
      多种子配对 Wilcoxon 检验(p≥0.05 一律记为噪声)、剔除 11 口恒零生产井
      (44 输出通道有 22 个是死的)。并证伪"负产率格点占比"这一指标:
      负产质量仅 7~105 m³ vs 累计产油 7.8e6 m³,单调约束惩罚项量级 7e-11 从未起作用。
  - id: decision_net
    path: _code/decision_net.py
    type: model
    status: appendix
    owner: col5
    description: >-
      历史段决策网络 + softmax/信赖域优化器。已被 fc_decision/forecast_gen 取代为主线,
      降级为附录的"上界臂"。含模拟器裁判 verify()。
  - id: fc_final
    path: _code/fc_final.py
    type: experiment
    status: active
    owner: col5
    run: "python _code/fc_final.py --gpu 0"
    description: >-
      代理模型**定版**。三分切分:test 400 全程封存 / train 1400 / val 200,
      超参只在 val 上选,选定后 train+val 重训 + 5 模型集成,test 只评一次。
      这修掉了 fc_improve 的选择性偏差(超参与报数用同一留出集)。
      结果:θ(24维) lr=3e-3/ep=600/d=128 + 集成5 → 封存 test 误差 0.478%±0.010%,
      R² 0.9926,相对平凡基线(5.745%) 12.0×。物理特征 +0.220pp(配对 t p<1e-4)显著有害,不入选。
  - id: fc_rank
    path: _code/fc_rank.py
    type: experiment
    status: active
    owner: col5
    run: "python _code/fc_rank.py --gpu 1"
    description: >-
      代理模型总排名。把 8 个模型全部重跑进 fc_final 的协议(同一 split_seed、
      同一批封存的 400 条 test、同一套指标 mean/median/p90/R²、随机性模型多次重复),
      因为旧的 fc_benchmark 报中位数+两分切分+单种子,与定版并排是范畴错误(见撤稿 #7)。
      结果:定版 Transformer+集成5 0.478% > 单模型 0.547% > MLP 1.005% > GBDT 1.333%
      > 高斯过程 1.348% > SVR 1.640% > 随机森林 3.043%;平凡基线 5.745%;
      PCA 结构性下界 0.047%(天花板,非模型)。Chronos-2 因信息不对等不入榜。
  - id: fc_gap
    path: _code/fc_gap.py
    type: experiment
    status: active
    owner: col5
    run: "python _code/fc_gap.py --gpu 2"
    description: >-
      Gap 分析:定位代理模型的误差来源,决定改哪一层。实测结论:误差 98.8% 是形状错(水平仅 1.2%);
      误差高频占 18.08% 而信号只占 4.63%;逐模态信噪比 15559→896(17×)→ 病灶是谱偏差。
      🔴 同时**排除**三条路线:物理违背全为 0(负产/累计非单调/含水越界)、
      水突破误差 0 天、无异方差(相关 +0.036)。省掉三个方向的无用功。
  - id: fc_models
    path: _code/fc_models.py
    type: model
    status: active
    owner: col5
    description: >-
      模型库:TFBase / Autoformer(序列分解+自相关) / DeepONet / FNO1d(谱卷积) / OursNet。
      任务定性:24 维静态参数 → 880 维轨迹,推理不看历史 → **参数化算子学习,不是时序预测**。
  - id: fc_arch
    path: _code/fc_arch.py
    type: experiment
    status: active
    owner: col5
    run: "python _code/fc_arch.py --gpu 3"
    description: >-
      骨干对照 + 模块消融(封存 test,单模型不集成,各骨干各自在 val 选 lr)。
      🔴 负结果:FNO/DeepONet 显著变差;Autoformer 与基线无差异(p=0.5066);
      我设计的 FiLM 显著有害、谱加权损失无效;"Ours 三模块全开"输给基线。
  - id: fc_arch2
    path: _code/fc_arch2.py
    type: experiment
    status: active
    owner: col5
    run: "python _code/fc_arch2.py --gpu 4"
    description: >-
      第二轮:12 种子确认傅里叶特征显著有效(n_bands 4/8/16 → 0.534/0.520/0.489%);
      FNO 公平调参(12 组超参)后仍显著变差;谱损失 alpha 0.1/1/10 全无效且确认非 no-op。
      🔴 已知缺陷:n_bands 直接在 test 上比较,存在 test-set selection bias,已由 fc_nb 修正。
  - id: fc_loop_surrogate_modeA
    path: _pipelines/fc_loop/results.tsv
    type: experiment
    status: source_lost
    owner: col5
    run: "🔴 源码已被覆盖,无法重跑;见 _legacy/2026-08-29-fc_loop-name-collision/TOMBSTONE.md"
    outputs:
      - _pipelines/fc_loop/loop.json
      - _pipelines/fc_loop/results.tsv
      - _pipelines/fc_loop/run.log
    description: >-
      Karpathy autoresearch Mode A 高频小步循环:固定 300ep 预算、一次一个变量、
      14 个实验按文献证据优先级排、只看 val(test 封存)。
      🔴 **2026-08-29 事故**:原实现 `_code/fc_loop.py` 被闭环盖亚任务的子智能体
      直接 `cat >` 覆盖。该文件当时 untracked,git 无版本,pycache 已被重编译,
      全仓无副本 —— **源码不可恢复**。结论与判定表幸存于上面三个 outputs
      (01 相对l2 [Wen2022] 0.627% keep ✔,其余 discard/持平,基线 0.715%)。
      待办:该 id 的 `path` 现指向幸存结果文件,不再指向源码。

  - id: fc_loop
    former_path: _code/fc_loop.py
    status: lost
    note: >-
      🔴 2026-08-29:该文件被 Workflow 子 agent 误覆盖成闭环盖亚脚本(已改名 fc_gaia_loop.py)。
      原始的 Karpathy 高频实验脚本内容已丢失(未提交 git)。其结论已沉淀在 README 与撤稿清单里,
      不影响任何已发布数字;需要时可按 registry 描述重建。
    type: experiment
    status: active
    owner: col2
