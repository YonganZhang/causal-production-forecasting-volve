      🔴 口径修正 + 因果性质询。(1) 把所有累计量从 40 点梯形积分改为模拟器自报的
      `field_cum`(FOPT/FWIT,逐时间步累加的精确值) —— 复核实测梯形积分分歧 sd 0.58%,
      是 ±0.05% 注水容差的 12~57 倍;修正后结论定性不变(只顾眼前的代价 +1.05%→+0.96%)。
      (2) 在 282 个算例上做偏回归,证明**空间重分配几乎没有独立贡献**
      (控制时间前置后增量 R² 仅 +0.0288),据此把论文叙事从"同样多的水换分法"
      改为"注水的**时间安排**决定 NPV"。见 README 撤稿 #16/#17。
  - id: fc_water_econ
    path: _code/fc_water_econ.py
    status: active
    purpose: >
      含注水/采出水成本的经济重评价。复用已有 283 个模拟算例的 FOPT/FWIT/FWPT，
      不跑新模拟即可回答"注多少水才划算"。此前 NPV 只算油收入、水零成本，
      导致"要不要多注水"在数学上退化，只能靠 softmax 硬锁总量替代。
    outputs: _pipelines/fc_water_econ/sweep.json
    key_result: >
      最优注水量随水价翻转：水免费时 +5.36%，水价 4/3 USD/bbl 时 -30.57%。
      各水价下最佳方案的 ΔNPV@8% 仍有 +375 ~ +721 M$。
    depends_on: [fc_fix]
  - id: fc_team
    path: _code/fc_team.py
    status: active
    purpose: >
      Gaia 油藏决策智能体团队的协议层 + Cartographer + 角色注册表。
      架构语义借自本机知识发现项目 deep_discover 的
      Discovery→Cartographer→Readers→adaptive Auditor→Synthesizer（只借语义，不跨项目 import）。
      每条消息强制携带 agent_id / confidence / provenance(source_id+region+type+SHA256)，
      使"多角色"从修辞变成可审计方法：无据可引的角色发不出合法消息。
    outputs: _pipelines/fc_team/cartography.json
    key_result: >
      从 283 个已模拟算例反推出注水井→生产井影响矩阵，11/22 生产井有显著响应；
      注水井影响力 F-1H 9.29 > F-3H 8.86 > F-2H 6.97 > F-4H 3.69；
      设计矩阵条件数 3.09（<30，归因可靠，已固化为自动 flag 自查）。
    depends_on: [forecast_gen, norne_bulk]
    todo: Readers / adaptive Auditor / Synthesizer 的 LLM 环路尚未接入
  - id: fc_team_proxy
    path: _code/fc_team_proxy.py
    status: active
    purpose: >
      代理模型包装：作为油藏数值模拟器的快速替身供智能体团队批量试错。
      不是"压缩搜索空间"的启发式，而是把 60 s 的模拟换成微秒级评估。
    outputs: _pipelines/fc_team/norm.npz
    key_result: >
      GPU 批量 4096 时 18.1 µs/方案，约 3.3e6 倍于全物理模拟；
      基准 theta=0 预测 7,469,380 vs 模拟器真值 7,493,840，误差 -0.33%。
      团队环路实测:代理对候选的误差稳定在 ±1.3% 以内。
    depends_on: [fc_mech, fc_rank_fidelity]

  - id: fc_team_loop
    path: _code/fc_team_loop.py
    status: active
    purpose: >
      Gaia 团队主环路 Readers → Synthesizer → 代理批量评估 → adaptive Auditor
      → OPM Flow 裁定 → 结果回流。终止条件为连续两轮零 high/medium 风险。
      --drop 可剔除任意角色做消融，不需改骨架。
    outputs: _pipelines/fc_team/loop_*.json
    key_result: >
      水价 2.0/1.0 USD/bbl 下三轮逐轮改善 ΔNPV@8% = +157.7 → +229.9 → +299.7 M$，
      最佳方案产油 +13.19% 而注水仅 +11.30%。
      🔴 关键教训:第一版按纯产油排序，团队一路加水(+35%→+40%→+58%)，
      在高水价下全部方案反而不如维持基准 —— 那是目标函数缺水成本项，不是智能体的错。
      改为经济排序后注水收敛到 +2%~+17%。
    depends_on: [fc_team, fc_team_proxy, fc_decide, fc_water_econ]
    todo: Auditor 仅能报警不能否决候选；四轮均未触发终止条件
  - id: fc_baselines
    path: _code/fc_baselines.py
    status: active
    purpose: >
      无 Agent 对照臂:不含任何 LLM 的平凡基线。依据 petro-knowledge/05-生产优化.md
      的「平凡基线」节实现 B2 一维均匀缩放、B4 等预算随机搜索、BG 贪心短期最优。
      此前的「无 Agent」臂是"一个什么都不知道的 LLM 在提方案"，既非 Agent 也非正经基线。
    outputs: _pipelines/fc_baselines/baselines_*.json
    depends_on: [fc_team_loop, fc_water_econ]
  - id: fc_truth
    path: _code/fc_truth.py
    status: active
    purpose: >
      模拟结果的**唯一**读取口径。类层修复"同一个量有多套算法":
      实测注水量/产油量/采出水量一律取模拟器自报的 field_cum(FWIT/FOPT/FWPT)，
      禁止梯形积分;基准值全项目唯一来源，禁止在提示词或脚本里硬编码。
    key_result: >
      审计实测:trapezoid(inj_actual) 与 FWIT 平均差 0.99pp、最大 3.12pp，
      按 ±25% 预算判可行性有 14 例结论相反。已统一 6 个文件 8 处调用。
    depends_on: []
  - id: fc_team_ablate
    path: _code/fc_team_ablate.py
    status: active
    purpose: >
      角色消融分析：先用完整臂重复测噪声底，再用 Welch t 检验判各角色边际贡献。
    outputs: _pipelines/fc_team/ablation.json
    key_result: >
      完整臂重复 5 次 ΔNPV@8% 在 +158~+249 M$ 间飘，合并 sd 51.3 M$；
      n=1 时 reservoir_engineer 显示 +102.6 M$「显著正贡献」，补到 n=6 后塌成 +15.6 M$。
      🔴 结论:LLM 智能体消融不先测重复性，任何单点消融表都不可信。
    depends_on: [fc_team_loop, fc_water_econ]

  - id: fc_team_diag
    path: _code/fc_team_diag.py
    status: active
    purpose: >
      诊断：把团队一轮里每个角色的完整输出、总工收到的完整输入与其完整回应落盘，
      用于定位信息在哪一步丢失。主环路日志只截 50 字，聚合数字看不出同质化。
    outputs: _pipelines/fc_team/diag_round.json
    key_result: >
      查出固定提示词写入"已知结论"把 7 个角色锚成同一意见；
      6 个候选挤在 θ∈[-0.20,+0.20]，而硬约束允许 ±1.0。
    depends_on: [fc_team, fc_team_loop]
  - id: fc_gaia_loop
    path: _code/fc_gaia_loop.py
    type: experiment
    status: active
    owner: col2
    description: >-
      闭环盖亚:Agent 提方案 → 确定性代码做注水校正 + OPM Flow 真跑 → 把真实结果喂回 → 修正。
      调度逻辑不吃 LLM(share-agent-development §1.6)。结果:+90.0 M$(2 次 OPM),
      **未超过无知识库 G0 单发的 +177.6 M$**;第二个 run 三轮全部超容差、无合格解。
      🔴 该文件曾误覆盖同名的 fc_loop.py(见 fc_loop 条目)。


  - id: gaia
    path: _code/gaia.py
    kind: library
    status: active
    run: "python _code/gaia.py [--json]"
    desc: |
      Gaia 框架结果的**唯一读取接口**。不实现算法,只把 fc_truth(实测口径)、
      fc_water_econ(经济)、_pipelines/fc_team(智能体臂)、fc_baselines(无 Agent)
      接到一个稳定表面上,并装配正式指标表。
      🔴 新增任何读数点必须调本模块,不得在临时脚本里重写 ΔNPV / 基准 / 批次口径 ——
      那正是 fc_truth 当初消灭的那类缺陷(同一个量两套算法,14 个算例判定相反)。
      正式批次常量 gaia.BATCH;历史批次已归档,见 _legacy/2026-09-06-batches-A2-E2-superseded/。
    gate: "path:_tests/test_gaia.py"
  - id: run_coarse_queue
    path: _code/run_coarse_queue.sh
    kind: driver
    status: active
    run: "bash _code/run_coarse_queue.sh   # REPS=10 交错随机化,跳过已完成"
    desc: |
      三臂对比的批次驱动。交错随机化臂顺序以免时间漂移与臂混杂;
      按内容指纹跳过已完成的重复,可安全反复调用补齐样本量。
      批次前缀在脚本头部;改前缀等于开新批次,旧批次须先归档。


  - id: fc_paper_figs
    path: _code/fc_paper_figs.py
    kind: script
    status: active
    run: "python _code/fc_paper_figs.py"
    desc: |
      论文正文图 Fig. 2-5。数据一律经 gaia / rank.json 读取,不在此重算任何口径。
      Fig.2 代理保真度(随机域 vs 优化区);Fig.3 三臂 + 真模拟预算;
      Fig.4 闭环轨迹;Fig.5 tilt 调度倾向。输出 _figures/paper/。
  - id: fc_paper_check
    path: _code/fc_paper_check.py
    kind: test
    status: active
    run: "python _code/fc_paper_check.py"
    desc: |
      🔴 论文正文数字核对。把 04_results.md / 03_methods.md 里每个数字回连到真源,
      对不上直接非零退出。当前 48 个数字 + 4 条定性关系。
      新增正文数字必须同步加一行 —— 这是"正文不得出现未核数字"的执行点。
      已抓到一次真实错误:井影响排序正文写 F-1H>F-3H>F-2H、F-4H=2.81,
      实测为 F-1H 8.57>F-2H 6.22>F-3H 6.06>F-4H 1.76。


  - id: gaia_sdk
    path: _code/gaia_sdk/
    kind: library
    status: active
    run: "python -m gaia_sdk [--json]   # 在 _code/ 下运行"
    desc: |
      🔴 Gaia Agent Team 的**参考实现**。14 个 Agent / 5 层:
      L1 数据(data_engineer, cartographer)· L2 知识(knowledge_curator)·
      L3 推理(7 领域角色 + synthesizer)· L4 评估(surrogate, feasibility_auditor)·
      L5 裁决(simulator_adjudicator,不是 Agent)。
      不实现新算法,只把已跑通并产出论文结果的环节包装成可调用 Agent,
      使论文里的架构图对应到可运行代码。
      忠实性由 _tests/test_gaia_sdk.py 的 15 项守住 —— 其中知识层产出与
      fc_team_loop.slice_for 做**逐字节**比对:SDK 是对已跑实验的打包,不是另一个系统。
    gate: "path:_tests/test_gaia_sdk.py"


  - id: fig1_spec
    path: _paper/_fig1_spec.json
    kind: spec
    status: active
    run: "python ~/.claude/skills/pptx-gen/scripts/generate_pptx.py _paper/_fig1_spec.json _outputs/pptx-gen/fig1"
    desc: |
      图一(Gaia 分层架构)的整页信息 spec,走 pptx-gen / FAL NanoBanana2 生成。
      🔴 share-sci-plot 硬不变量 6:schematic 不以 matplotlib 方块拼接。
